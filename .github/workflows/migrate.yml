name: Migrate production

# Applies new Supabase migrations to production when they land on main
# (ADR 0038). Pull requests already ran them in CI against a throwaway database.
on:
  push:
    branches: [main]
    paths: [supabase/migrations/**]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a migration halfway; a later push waits for the current run.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # supabase/config.toml points at this gitignored file; the CLI won't load without it.
      - run: node scripts/ensure-signing-keys.ts
      - run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: pnpm exec supabase migration list --remote
      - run: pnpm exec supabase db push --remote --yes
