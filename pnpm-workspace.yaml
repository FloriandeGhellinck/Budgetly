packages:
  - "apps/*"
  - "packages/*"

# One version per dependency across the workspace. Packages reference these
# with "catalog:". Entries for libraries not yet used are reserved for the
# packages that will need them (ADR 0015).
catalog:
  # Tooling
  "@types/node": ^26.6.6
  lefthook: ^2.2.2
  oxfmt: ^0.77.0
  oxlint: ^1.92.0
  oxlint-tsgolint: ^7.0.2006
  supabase: ^3.0.0
  "@playwright/test": ^1.65.0
  tsdown: ^0.23.7
  typescript: 7.0.2
  vitest: ^5.1.0

  # Data
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  postgres: ^3.4.9

  # API
  "@hono/node-server": ^2.1.6
  "@orpc/client": ^1.16.2
  "@orpc/contract": ^1.16.2
  "@orpc/server": ^1.16.2
  hono: ^4.13.17
  jose: ^6.2.15
  zod: ^4.6.7

  # Web
  "@base-ui/react": ^1.9.0
  "@supabase/ssr": ^0.12.7
  "@supabase/supabase-js": ^2.119.0
  "@tailwindcss/postcss": ^4.3.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  next: 16.4.5
  next-intl: ^4.14.9
  react: 19.3.1
  react-dom: 19.3.1
  server-only: ^0.0.1
  shadcn: ^4.23.0
  tailwindcss: ^4.3.5

  # UI (packages/ui, pulled in by shadcn components)
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.2
  lucide-react: ^1.70.0
  next-themes: ^0.4.6
  react-day-picker: ^10.0.2
  # Pinned by the shadcn chart recipe.
  recharts: 3.8.0
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

allowBuilds:
  # Prebuilt binaries come from optional dependencies; their install scripts only rebuild.
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  lefthook: true
  supabase: true
  sharp: false
  unrs-resolver: false
